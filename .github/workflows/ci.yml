name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Typecheck ${{ matrix.pacote }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pacote:
          - gateway
          - services/auth-service
          - services/crm-service
          - services/erp-service
          - services/finance-service
          - services/ai-service

    defaults:
      run:
        working-directory: ${{ matrix.pacote }}

    env:
      # O prisma.config.ts exige DATABASE_URL ao carregar, inclusive no
      # "prisma generate" do postinstall. O generate não conecta no banco,
      # então um valor fictício basta para o typecheck.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pacote }}/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p .

  testes:
    name: Testes de integração ${{ matrix.pacote }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pacote:
          - services/crm-service
          - services/erp-service
          - services/finance-service

    # Os testes rodam contra um PostgreSQL de verdade: as corridas de
    # concorrência (UPDATE condicional, restrição única) só se comprovam
    # no banco real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ${{ matrix.pacote }}

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pacote }}/package-lock.json

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    name: Lint e build do frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
