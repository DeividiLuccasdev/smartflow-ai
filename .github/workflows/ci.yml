name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Typecheck ${{ matrix.pacote }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pacote:
          - gateway
          - services/auth-service
          - services/crm-service
          - services/erp-service
          - services/finance-service
          - services/ai-service

    defaults:
      run:
        working-directory: ${{ matrix.pacote }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pacote }}/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p .

  frontend:
    name: Lint e build do frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
